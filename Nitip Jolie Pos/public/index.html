<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2169f5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POS">
<title>POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#2169f5;--red-l:color-mix(in srgb,var(--red) 8%,#fff);--tx:#1c1c28;--mut:#7a7a86;--bd:#e4e4ea;--ok:#1b8a4b;--pink:#c2185b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);background:#e9e9ee;font-size:13px}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;min-height:100vh;margin:0 auto;background:#fff;position:relative;padding-bottom:96px}
svg{display:block}
.mut{color:var(--mut)}.sm{font-size:11.5px}.c{text-align:center}.b{font-weight:700}

/* banner */
.banner{position:relative;aspect-ratio:16/6;overflow:hidden;background:var(--red)}
.sun{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 72% 55%,var(--red) 0 8deg,color-mix(in srgb,var(--red) 82%,#fff) 8deg 16deg)}
.bimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.logo{position:absolute;left:18px;top:50%;transform:translateY(-50%);height:148px;max-width:2520px;object-fit:contain}
.logot{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#fff;font-weight:800;font-size:24px;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.lang{position:absolute;right:10px;top:8px;background:rgba(40,40,45,.78);color:#fff;border-radius:6px;padding:5px 8px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:11px}
.flag{width:18px;height:12px;border-radius:2px;background:linear-gradient(#e11 50%,#fff 50%);border:1px solid rgba(255,255,255,.4)}
.pad{padding:0 14px}
.tt{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 4px}
.tt h1{margin:0;font-size:19px;font-weight:800;line-height:1.25}
.ib{width:18px;height:18px;border-radius:50%;background:#9a9aa3;color:#fff;border:0;font-weight:800;font-size:11px;font-family:serif;display:flex;align-items:center;justify-content:center;flex:none}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 28px);margin:10px 14px 0;height:32px;border:1px solid #b5b5bd;border-radius:8px;background:#fff;font-weight:600;font-size:12px}
.pill.red{background:var(--red-l);border-color:var(--red);font-weight:800}
.sechd{display:flex;align-items:center;justify-content:space-between;padding:20px 14px 6px}
.sechd h2{margin:0;font-size:16px;font-weight:800}
.sechd button{background:none;border:0;padding:2px;color:#34327a}
.cathd{font-weight:800;font-size:14px;padding:10px 14px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 16px}
.gap{height:8px;background:#f1f1f3}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.14);overflow:hidden}
.pimg{height:86px;background:#fdf1ec;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pb{padding:8px 8px 10px}
.pn{font-weight:800;font-size:11.5px;margin-bottom:3px}
.pp{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:12px;margin-bottom:4px}
.pp b{font-weight:500}
.pp s{color:#9a9aa3;font-size:9px}
.bd{background:var(--red);color:#fff;border-radius:2px;font-size:8px;font-weight:700;padding:1px 3px;font-style:normal}
.hrt{font-size:10px;color:#555;margin-bottom:7px;display:flex;align-items:center;gap:3px;min-height:12px}
.hrt span{color:#e8553e;font-size:9px}
.tb{width:100%;height:26px;border:1px solid var(--red);background:#fff;color:var(--red);border-radius:4px;font-weight:700;font-size:11.5px}
.tb.on{background:var(--red);color:#fff}
.foot{text-align:center;padding:10px 0 26px}
.foot button{background:none;border:0;color:#9a9aa3;font-size:11px;text-decoration:underline}

/* fixed */
.fx{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.12);border-radius:14px 14px 0 0;z-index:30;padding:12px 16px;display:flex;align-items:center;gap:12px}
.fx .tot{flex:1;line-height:1.25}.fx .tot b{font-size:13px;font-weight:800}.fx .tot small{display:block;color:#9a9aa3;font-size:10px;font-weight:600}
.fx .tot button{background:none;border:0;padding:0;text-align:left;display:block}
.bag{color:#222;flex:none}
.btn{height:40px;border-radius:7px;border:1px solid var(--red);background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:0 22px}
.btn.o{background:#fff;color:var(--red)}
.btn.g,.btn:disabled{background:#e6e6ea;border-color:#e6e6ea;color:#9b9ba3;cursor:not-allowed}
.btn.w{flex:1}
.btn.sq{width:48px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.wa{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;pointer-events:none;z-index:29;height:100%}
.wa a{position:absolute;right:14px;bottom:88px;width:36px;height:36px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:auto}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:center;align-items:flex-end}
.sheet{width:100%;max-width:480px;max-height:90vh;background:#fff;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.sh-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.sh-hd b{font-size:14px;font-weight:700}
.x{background:none;border:0;padding:2px;color:#333}
.sh-bd{overflow:auto;padding:0 16px 14px;flex:1}
.sh-ft{border-top:1px solid #eee;padding:10px 16px;display:flex;align-items:center;gap:14px}
.vimg{height:150px;border-radius:12px;background:#fdf1ec;display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden;margin:2px 0 12px}
.vimg img{width:100%;height:100%;object-fit:cover}
.vn{font-weight:800;font-size:13px}.vp{font-weight:600;font-size:13px;margin:3px 0}
.grp{border-top:8px solid #f1f1f3;margin:12px -16px 0;padding:14px 16px 4px}
.grp h4{margin:0 0 3px;font-size:13px;font-weight:800}
.grp .sub{font-size:11px;color:var(--mut);margin-bottom:6px}
.opt{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:12px;color:#444;cursor:pointer}
.opt .p{margin-left:auto;color:#666;white-space:nowrap;padding-left:8px}
.cb{width:18px;height:18px;border:1.5px solid #bdbdc6;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.cb.on{background:var(--red);border-color:var(--red)}
.in{width:100%;height:38px;border:1px solid #dcdce2;border-radius:6px;padding:0 10px;background:#fff;outline:none}
.in:focus{border-color:var(--red)}
textarea.in{height:auto;padding:9px 10px;resize:none}
.qty{display:flex;align-items:center;gap:12px;font-weight:700}
.qty button{width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.trow{display:flex;align-items:center;gap:14px;border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px;cursor:pointer;background:#fff;width:100%;text-align:left}
.trow .ic{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.trow b{font-size:12px;font-weight:800;display:block}.trow small{font-size:10px;color:#666;line-height:1.4;display:block;margin-top:3px}

/* checkout pages */
.tb-top{position:sticky;top:0;z-index:20;background:var(--red-l);border-top:2px solid var(--red);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:12px}
.tb-top span{display:flex;align-items:center;gap:12px;color:#222}.tb-top svg{color:var(--red)}
.tb-top .t{font-size:13px}
.h{font-size:14px;font-weight:800;margin:16px 0 3px}
.hint{font-size:10px;color:var(--mut);margin:5px 0 12px}
.phone{display:flex;align-items:center;background:#f1f1f5;border-radius:8px;height:44px;padding:0 12px;gap:10px}
.phone .f{display:flex;align-items:center;gap:6px;color:#666;font-size:10px;padding-right:10px;border-right:1px solid #ddd}
.phone input{border:0;background:transparent;flex:1;outline:none;height:100%;font-weight:700;font-size:13px}
.fld{width:100%;height:44px;background:#f1f1f5;border:0;border-radius:8px;padding:0 14px;font-weight:700;outline:none;margin-bottom:12px}
.addr{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:14px;color:#555;cursor:pointer;background:#fff;width:100%;text-align:left}
.addr span{flex:1;font-size:12px}
.sep{height:6px;background:#f1f1f3;margin:16px -14px 0}
.fb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;padding:12px 16px 14px;display:flex;gap:14px;z-index:30;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.fb{flex-wrap:wrap}
.legal{font-size:9px;text-align:center;color:#666;width:100%}
.sname{font-weight:800;font-size:12.5px;margin:16px 0 4px}
.saddr{font-size:10px;color:#555;line-height:1.5}
.bx{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-top:14px}
.bx div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:12px;color:#444}
.bx div b{color:#111;font-weight:700;text-align:right}
.dash{border-top:1px dashed #d4d4da;margin:14px 0}
.when{display:flex;align-items:center;gap:12px;font-size:11px}
.when .ic{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.when b{display:block;font-size:12px;font-weight:800;margin-top:2px}
.ord-h{background:#f4f4f6;margin:0 -14px;padding:10px 14px;font-weight:800;font-size:13px}
.it{display:flex;gap:10px;padding:12px 0 4px;font-size:12px}
.it .q{width:20px;font-weight:700;flex:none}
.it .m{flex:1}
.it .m .r{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;color:#444}
.it .m .r.h1{color:#222}
.it .pr{text-align:right}.it .pr em{display:block;font-style:normal;font-size:10px;color:#e0453d;margin-top:2px}.it .pr em s{color:#999}
.lk{background:none;border:0;color:var(--pink);font-weight:700;font-size:11px;padding:0;margin-right:14px}
.rw{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:#333}
.vch{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:11.5px;margin-top:12px}
.vch i{width:22px;height:22px;border-radius:50%;background:#f7b500;color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px}
.vch span{flex:1}.vch button{background:#f7b500;border:0;color:#fff;border-radius:6px;padding:5px 12px;font-weight:700;font-size:11px}
.gt{display:flex;justify-content:space-between;font-weight:800;font-size:14px;padding:4px 0}
.gt b{font-size:16px}
.pm{display:flex;align-items:center;gap:12px;border:1.5px solid var(--bd);border-radius:10px;padding:12px;margin-top:10px;cursor:pointer;background:#fff;width:100%;text-align:left}
.pm.on{border-color:var(--red);background:var(--red-l)}
.pm .ic{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.pm b{display:block;font-size:12.5px}.pm small{color:var(--mut);font-size:10.5px}
.rd{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid #bbb;flex:none}
.pm.on .rd{border:5px solid var(--red)}
.payd{border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick button{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600}
.kb{background:#e8f7ee;color:var(--ok);padding:10px;border-radius:8px;font-weight:800;margin-top:12px;text-align:center}
.kb.neg{background:var(--red-l);color:var(--red)}
.rek{font-size:22px;font-weight:800;letter-spacing:1px;margin:6px 0}
.qr{width:220px;height:220px;object-fit:contain;border:1px solid var(--bd);border-radius:10px;margin:10px auto;display:flex;align-items:center;justify-content:center;color:var(--mut);padding:12px;text-align:center;font-size:11px}
.done .ico{width:64px;height:64px;border-radius:50%;margin:24px auto 10px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--ok)}
.done .ico.w{background:#f7b500}
.stc{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;background:#fff3cf;color:#8a6100}
.stc.Lunas{background:#e8f7ee;color:var(--ok)}.stc.Selesai{background:#eee;color:#555}.stc.Dibatalkan{background:#fdecea;color:#b42318}

/* admin */
.ahd{background:var(--red);color:#fff;padding:14px 14px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px}
.ahd button{background:none;border:0;color:#fff;padding:0}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;background:none;border:0;padding:12px 4px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--red);border-color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.oc{border:1px solid var(--bd);border-left:4px solid #f7b500;border-radius:10px;padding:12px;margin:0 14px 10px}
.oc.Lunas{border-left-color:var(--ok)}.oc.Selesai{border-left-color:#999}.oc.Dibatalkan{border-left-color:#d92d20}
.oc .r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lab{display:block;font-size:11px;color:var(--mut);font-weight:600;margin:12px 0 5px}
.imgf{display:flex;align-items:center;gap:12px}
.imgf .pv{width:96px;height:48px;border:1px dashed #ccc;border-radius:8px;background:#f6f6f8 center/contain no-repeat;flex:none}
.upl{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1px solid var(--red);color:var(--red);border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;background:#fff}
.upl input{display:none}
.pr-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #f0f0f2}
.pr-row .th{width:52px;height:52px;border-radius:8px;background:#fdf1ec center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.pr-row .i{flex:1;min-width:0}.pr-row .i b{display:block;font-size:12px}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;z-index:90;max-width:90%;text-align:center}
.demo{background:#fff8e1;color:#7a5b00;font-size:11px;text-align:center;padding:5px}
@media print{body{background:#fff}.fx,.fb,.wa,.noprint,.demo,.tb-top{display:none!important}#app{padding:0}}
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor-group{padding:12px;border:1px solid var(--bd);border-radius:10px;margin-top:14px}.choice-row{display:grid;grid-template-columns:minmax(0,1fr) 95px 20px;gap:8px;align-items:end}.choice-row .lk{margin:0 0 12px;font-size:20px}.oc b{overflow-wrap:anywhere;min-width:0}fieldset:disabled{opacity:.65}
.icon-refresh{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;width:40px;height:40px;flex-shrink:0;margin-left:6px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--red)}.icon-refresh:hover{background:var(--red-l)}.icon-refresh:disabled{opacity:.5;cursor:wait}.icon-refresh.is-loading svg{animation:refresh-turn 1s linear infinite}@keyframes refresh-turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.icon-refresh.is-loading svg{animation:none}}.brand-label{font-size:10px;font-weight:800;color:var(--red);margin-bottom:5px;overflow-wrap:anywhere}.brand-filters{padding-top:4px;padding-bottom:14px}

/* Reference-inspired catalog: blue, navy and soft neutral surfaces. */
:root{--tx:#092647;--mut:#536b8b;--bd:#dce6f3;--pink:#2169f5}
body{background:#e9eff6;line-height:1.5}
#app{max-width:520px;background:#f4f7fc;box-shadow:0 0 60px #233f6210}
.fx,.fb,.wa,.sheet{max-width:520px}
button,input,textarea,select{font:inherit}button,input,textarea,select{touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #89b4ff;outline-offset:3px}
.banner{aspect-ratio:16/6;background:var(--red)}.sun{background:linear-gradient(120deg,#0e3e9c,var(--red))}
.tt{padding:22px 18px 8px}.tt h1{font-size:22px;letter-spacing:-.6px}.ib{background:#e2ebfa;color:#264a7a;width:24px;height:24px}
.pill{width:calc(100% - 36px);margin-left:18px;margin-right:18px;min-height:40px;height:auto;padding:8px 12px;border-color:var(--bd);border-radius:12px}.pill.red{color:var(--red);border-color:#dbe7fc;font-weight:600}
.chips{scrollbar-width:thin}.catalog-categories{padding:20px 18px 12px;gap:8px}.chip{min-height:40px;padding:8px 16px;border-color:var(--bd)}
.catalog-toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:0 18px}
.catalog-toolbar select{width:65%;min-width:0;min-height:46px;padding:0 14px;border:1px solid #c5d5ec;border-radius:12px;background:#fff;color:var(--tx);font-size:14px}
.view-toggle{height:44px;width:44px;border:1px solid var(--bd);background:#fff;border-radius:12px;display:grid;place-items:center;color:var(--tx);flex:none}
.catalog-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 14px}.catalog-heading h2{margin:0;font-size:14px;font-weight:800}.catalog-heading span{font-size:11px;color:var(--mut)}
.catalog-products{gap:10px;padding:0 18px 18px;grid-template-columns:repeat(2,minmax(0,1fr))}
.catalog-products .card{padding:10px;border:1px solid #e7edf6;border-radius:18px;box-shadow:none;min-width:0;display:flex;flex-direction:column;transition:box-shadow .18s ease,border-color .18s ease}
.catalog-products .pimg{height:110px;border-radius:12px;flex:none}.pimg.is-coffee{background:#f5ecde;color:#9e7b48}.pimg.is-food{background:#e7edf9;color:#5477b4}.catalog-products .pimg svg{width:30px;height:30px}
.catalog-products .pb{padding:12px 0 0;display:flex;flex-direction:column;flex:1;min-width:0}.brand-label{font-size:10px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;margin:0 0 3px;color:var(--red)}
.catalog-products .pn{font-size:12px;font-weight:800;line-height:1.5;margin:0 0 3px;overflow-wrap:anywhere}.product-description{font-size:11px;line-height:1.6;color:var(--mut);margin:0 0 9px;overflow-wrap:anywhere}

.pv-title{margin:4px 0 8px;font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.3;color:var(--tx)}
.pv-desc{margin:0 0 12px;color:var(--mut);line-height:1.65;font-size:13px}
.pv-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pv-price{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;color:var(--tx)}.pv-price s{color:#9a9aa3;font-size:12px}
.pv-step{margin-top:2px}.pv-step button{width:44px;height:44px}.pv-step output{min-width:44px;font-size:16px}
.pv-step button:disabled{opacity:.4;cursor:not-allowed}
/* Status toko, stok, pelacak pesanan */
.store-st{display:inline-flex;align-items:center;gap:6px;margin:0 18px 8px;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:#e8f7ee;color:#157347}
.store-st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.store-st.closed{background:#fdecea;color:#b42318}
.tb.sold,.tb.sold:disabled{background:#eef1f6;border-color:#dfe5ee;color:#8a97ab;cursor:not-allowed;opacity:1}
.stok-tag{font-size:10.5px;font-weight:700;color:#b45309;background:#fff4e0;border-radius:6px;padding:2px 6px}
.card.is-sold .pimg{filter:grayscale(1);opacity:.6}
.ck-warn{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#fff4e0;color:#8a5200;font-size:12px;line-height:1.55}
.track{display:flex;align-items:center;gap:6px;width:calc(100% - 28px);margin:12px 14px 0;padding:6px 6px 6px 14px;border:1px solid #cfe0ff;background:var(--red-l);border-radius:14px;color:var(--tx)}
.tk-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:44px;background:none;border:0;padding:0;text-align:left;color:inherit}
.tk-main b{display:block;font-size:13px}.tk-main small{color:var(--mut);font-size:11.5px}
.tk-dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;animation:glow 1.6s infinite}
.tk-x{width:40px;height:40px;border:0;background:none;color:var(--mut);font-size:22px;line-height:1;border-radius:12px;flex:none}
.tl{margin:16px 0 4px;padding:16px;border:1px solid var(--bd);border-radius:14px;background:#fff}
.tl-s{position:relative;display:flex;gap:12px;padding:0 0 18px;color:var(--mut);font-size:12.5px}
.tl-s:last-child{padding-bottom:0}
.tl-s::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--bd)}
.tl-s:last-child::before{display:none}
.tl-d{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:#fff;flex:none;display:grid;place-items:center;color:#fff;z-index:1}
.tl-s.done{color:var(--tx)}.tl-s.done .tl-d{background:var(--ok);border-color:var(--ok)}.tl-s.done::before{background:var(--ok)}
.tl-s.now{color:var(--tx);font-weight:800}.tl-s.now .tl-d{border-color:var(--red);animation:glow 1.6s infinite}
.tl-s.now .tl-d::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.tl-t small{display:block;font-weight:500;color:var(--mut);font-size:11px;margin-top:2px}
.stc.Diproses{background:#e6efff;color:#1d4ed8}.stc.Siap{background:#fff0d9;color:#9a5b00}
.oc.Diproses{border-left-color:#2169f5}.oc.Siap{border-left-color:#f59e0b}
.oc.fresh{animation:glow 1.4s 4}
.tabs button .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:#d92d20;color:#fff;font-size:10.5px;font-weight:800;vertical-align:1px}
.ahd .live{margin-left:auto;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;opacity:.95}
.ahd .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#7cf0a6;animation:livePulse 1.6s infinite}
.oc .r>span{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.offline-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:#92400e;color:#fff;text-align:center;font-size:12px;padding:6px 10px;display:none}
.foot{display:flex;flex-direction:column;align-items:center}
/* Gerakan dikurangi: durasi dipangkas (bukan animation:none) agar keadaan akhir, mis. centang sukses, tetap tampil. */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div id="app"><div style="padding:40px 22px;text-align:center" role="status"><b>Memuat toko&#x2026;</b><p style="color:#777;line-height:1.6">Sedang mengambil produk dari Google Sheets.</p><noscript>Aktifkan JavaScript untuk membuka aplikasi.</noscript></div></div>
<div id="bar"></div>
<div id="wa"></div>

  };
  window.posReady = function () {

function parseHours(str) {

  const o = +m[1] * 60 + +m[2],
    c = +m[3] * 60 + +m[4];
  if (+m[2] > 59 || +m[4] > 59 || o > 1439 || c > 1440 || o === c) return null;
  return {
    open: o,
    close: c
  };
}

};
const hoursText = h => hhmm(h.open) + " - " + hhmm(h.close);

function primeAudio() {

        o = audioCtx.createOscillator(),
        g = audioCtx.createGain();

      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);

}

  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type) || file.size > 20 * 1024 * 1024) return Promise.reject(new Error("Pilih gambar PNG, JPG, WebP, atau GIF maksimal 20 MB."));
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxW / img.width, maxW / img.height),
          c = document.createElement("canvas");
        c.width = Math.round(img.width * sc);
        c.height = Math.round(img.height * sc);
        const x = c.getContext("2d");
        if (type === "image/jpeg") {
          x.fillStyle = "#fff";
          x.fillRect(0, 0, c.width, c.height);
        }
        x.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(type, .78));
      };
      img.onerror = () => rej(new Error("Gambar tidak bisa dibaca"));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error("Gagal membaca file"));
    fr.readAsDataURL(file);
  });
}

async function adminPoll() {
  if (pollBusy || !adm.ok || page !== "admin" || adm.tab !== "pesanan" || document.hidden || adm.ordersLoading || modal) return;

  try {
    const res = await api("listOrders", adm.pin, 30, null);
    if (!adm.ok || page !== "admin") return;
    const fresh = res.orders,
      seen = adm.seen || new Set(adm.orders.map(o => o.ID)),
      added = fresh.filter(o => !seen.has(o.ID)),
      sig = list => list.map(o => o.ID + ":" + o.Status).join("|"),
      merged = [...fresh, ...adm.orders.filter(o => !fresh.some(f => f.ID === o.ID))],

    if (adm.orders.length <= 30) adm.orderNext = res.nextRow;

// Grafik area SVG ringan (tanpa library): sumbu kanan, label nilai bila titik sedikit.
function areaChart(pts, fmt) {
  const W = 360,
    H = 190,
    L = 12,
    R = 46,
    T = 26,
    B = 26,
    n = pts.length,
    top = niceMax(Math.max(1, ...pts.map(p => p.v)));
  const x = i => n === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1),
    y = v => T + (H - T - B) * (1 - v / top);

    area = line + " L" + x(n - 1).toFixed(1) + "," + y(0).toFixed(1) + " L" + x(0).toFixed(1) + "," + y(0).toFixed(1) + " Z";
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const yy = y(top * k / 4);
    g += "\x3cline x1=\"" + L + "\" x2=\"" + (W - R) + "\" y1=\"" + yy.toFixed(1) + "\" y2=\"" + yy.toFixed(1) + "\" stroke=\"#e6ebf3\" stroke-width=\"1\"/>\x3ctext x=\"" + (W - R + 6) + "\" y=\"" + (yy + 3.5).toFixed(1) + "\" font-size=\"10\" fill=\"#8a97ab\">" + fmt(top * k / 4) + "\x3c/text>";
  }
  const step = Math.ceil(n / 7);
  let xl = "",
    dots = "";
  pts.forEach((p, i) => {
    if (i % step === 0 || i === n - 1) xl += "\x3ctext x=\"" + x(i).toFixed(1) + "\" y=\"" + (H - 8) + "\" font-size=\"10\" fill=\"#8a97ab\" text-anchor=\"middle\">" + esc(p.l) + "\x3c/text>";
    if (n <= 31 && p.v > 0) dots += "\x3ccircle cx=\"" + x(i).toFixed(1) + "\" cy=\"" + y(p.v).toFixed(1) + "\" r=\"3.2\" fill=\"#fff\" stroke=\"var(--red)\" stroke-width=\"2\"/>";
    if (n <= 12 && p.v > 0) dots += "\x3ctext x=\"" + x(i).toFixed(1) + "\" y=\"" + (y(p.v) - 8).toFixed(1) + "\" font-size=\"10\" font-weight=\"700\" fill=\"#092647\" text-anchor=\"middle\">" + fmt(p.v) + "\x3c/text>";
  });
  return "\x3csvg viewBox=\"0 0 " + W + " " + H + "\" role=\"img\" aria-label=\"Grafik laporan\">\x3cdefs>\x3clinearGradient id=\"rg\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\x3cstop offset=\"0\" style=\"stop-color:var(--red);stop-opacity:.35\"/>\x3cstop offset=\"1\" style=\"stop-color:var(--red);stop-opacity:0\"/>\x3c/linearGradient>\x3c/defs>" + g + "\x3cpath d=\"" + area + "\" fill=\"url(#rg)\"/>\x3cpath d=\"" + line + "\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>" + dots + xl + "\x3c/svg>";
}

    const img = new Image(),

      res(null);
    };
    img.src = url;
  });
}

        out.push(line);
        line = w;

}
function fitText(ctx, text, maxW) {

function paintStruk(r, logo, ctx, W, draw) {

  dash();
  row("Subtotal", rp(r.subtotal), "400", 14, "#222");

  row("Status", lunas ? "Lunas" : r.status === "Dibatalkan" ? "Dibatalkan" : "Belum dibayar", "400", 14, "#222");
  row("Jadwal", r.jadwal ? scheduleLabel(r.jadwal) : "Secepatnya", "400", 13, "#222");
  y += 8;
  center("Terima kasih sudah memesan", "800", 14, "#111", 26);

}
function buildStruk(r, logo) {
  const PW = 336,
    M = 14,
    K = 2,
    tmp = document.createElement("canvas").getContext("2d"),
    h = Math.ceil(paintStruk(r, logo, tmp, PW, false)),
    c = document.createElement("canvas");
  c.width = (PW + M * 2) * K;
  c.height = (h + M * 2) * K;
  const ctx = c.getContext("2d");
  ctx.scale(K, K);
  ctx.fillStyle = "#dfe3e9";
  ctx.fillRect(0, 0, PW + M * 2, h + M * 2);
  ctx.translate(M, M);
  ctx.beginPath();
  ctx.moveTo(0, 4);
  for (let x = 0; x < PW; x += 8) {
    ctx.lineTo(x + 4, 0);
    ctx.lineTo(x + 8, 4);
  }
  ctx.lineTo(PW, h - 4);
  for (let x = PW; x > 0; x -= 8) {
    ctx.lineTo(x - 4, h);
    ctx.lineTo(x - 8, h - 4);
  }
  ctx.closePath();
  ctx.fillStyle = "#fff";
  ctx.fill();
  paintStruk(r, logo, ctx, PW, true);
  return c;
}

// Pratinjau ongkir dihitung server (jarak lewat jalan); total final dihitung ulang saat pesanan disimpan.
